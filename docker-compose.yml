# Despliegue de la versión web en el VPS.
#   docker compose up -d --build
# Queda en http://IP-DEL-VPS:8080. Si el VPS usa Dokploy, Traefik o un proxy
# con dominio y HTTPS, apunta el proxy al puerto 8080 del contenedor y quita "ports".
services:
  web:
    build:
      context: .
      args:
        # Enlace público del APK para el botón "Descargar App (Android)"
        VITE_APK_DOWNLOAD_URL: ${VITE_APK_DOWNLOAD_URL:-}
    image: costura-web
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Vitrina de Modistas (D-15) en http://IP-DEL-VPS:8081
  vitrina:
    build:
      context: ./vitrina
    image: costura-vitrina
    restart: unless-stopped
    environment:
      VITRINA_CLAVE_ADMIN: ${VITRINA_CLAVE_ADMIN:-}
    volumes:
      - vitrina-datos:/datos
    ports:
      - "8081:8080"

volumes:
  vitrina-datos:
