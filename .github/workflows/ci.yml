name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'integracion-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Vite 8 exige Node 20.19+ o 22.12+; se usa 24, la versión del entorno de desarrollo
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    # `npm ci` en lugar de `npm install`: instala exactamente lo que dice el
    # lockfile y falla si package.json y package-lock.json no concuerdan. Con
    # `npm install` una dependencia sin declarar pasaba desapercibida porque
    # llegaba como transitiva de otro paquete.
    # --ignore-scripts: ninguna dependencia necesita scripts de instalación
    - name: Install dependencies
      run: npm ci --ignore-scripts

    # Falla si una dependencia que viaja en el APK o en la web tiene una
    # vulnerabilidad alta o crítica publicada. Así se detectó DEF-01
    # (@capacitor/android 8.4.0) a mano; ahora lo detecta la CI.
    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Run Tests & Coverage
      run: npm run test:unit

    - name: Build Project
      run: npm run build

  # La imagen web: se construye, se levanta y se comprueba con peticiones reales
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Construir la imagen
      run: docker build -t costura-web .

    - name: Levantar el contenedor
      run: |
        docker run -d --name costura -p 8080:8080 costura-web
        for i in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done

    - name: Comprobar rutas, tipos y encabezados
      run: |
        set -e
        # Una ruta profunda de Vue Router devuelve la app, no un 404
        curl -fs http://localhost:8080/ordenes/3 | grep -q '<div id="app">'
        # Los archivos de la app se piden desde la raíz (compilado con base /)
        JS=$(curl -fs http://localhost:8080/ | grep -o 'src="/assets/[^"]*\.js"' | head -1 | cut -d'"' -f2)
        test -n "$JS"
        curl -fsI "http://localhost:8080$JS" | grep -qi 'content-type: application/javascript'
        curl -fsI "http://localhost:8080$JS" | grep -qi 'x-content-type-options: nosniff'
        # Un archivo que no existe en /assets da 404, no index.html
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/no-existe.js)" = "404"
        # SQLite del navegador: el .wasm con su tipo correcto
        WASM=$(docker exec costura sh -c 'cd /usr/share/nginx/html && find . -name "*.wasm" | head -1' | sed 's#^\.##')
        curl -fsI "http://localhost:8080$WASM" | grep -qi 'content-type: application/wasm'
        echo "Imagen web verificada"

    - name: Registro del contenedor si algo falla
      if: failure()
      run: docker logs costura

  # Vitrina de Modistas (D-15): imagen propia, con datos en un volumen
  vitrina:
    runs-on: ubuntu-latest
    # Solo lee el código: el token del trabajo no puede escribir nada
    permissions:
      contents: read
    steps:
    # Fijada al commit de la v4.2.2: una etiqueta se puede mover, un commit no.
    # Sin guardar credenciales en .git: los pasos siguientes no las necesitan
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false

    - name: Construir la imagen
      run: docker build -t costura-vitrina vitrina

    # Un solo paso: la clave de administración se genera aquí, en cada ejecución,
    # y no sale de este paso ni queda escrita en el repositorio
    - name: Levantar el contenedor y comprobar la página, la API y que los datos sobreviven a un reinicio
      run: |
        set -e
        CLAVE=$(openssl rand -hex 20)
        echo "::add-mask::$CLAVE"
        esperar() { for i in $(seq 1 30); do curl -fs http://localhost:8081/healthz && return 0; sleep 1; done; return 1; }
        docker run -d --name vitrina -p 8081:8080 -e VITRINA_CLAVE_ADMIN="$CLAVE" costura-vitrina
        esperar
        curl -fs http://localhost:8081/ | grep -q 'Vitrina de'
        curl -fsI http://localhost:8081/ | grep -qi "content-security-policy: default-src 'self'"
        curl -fs http://localhost:8081/api/prendas | grep -q '"prendas":\[\]'
        curl -fs -X POST -H 'Content-Type: application/json' \
          -d '{"nombre":"Taller CI","ciudad":"Bogotá","barrio":"Centro","whatsapp":"3001234567","aceptaCondiciones":true}' \
          http://localhost:8081/api/modistas | grep -q '"estado":"pendiente"'
        docker restart vitrina
        esperar
        curl -fs -H "Authorization: Bearer $CLAVE" http://localhost:8081/api/admin/modistas | grep -q 'Taller CI'
        echo "Imagen de la vitrina verificada"

    - name: Registro del contenedor si algo falla
      if: failure()
      run: docker logs vitrina
