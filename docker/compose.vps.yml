# Despliegue en el VPS del portafolio:
#   https://proyectosena.online/costura-app/  la app (servicio web)
#   https://proyectosena.online/vitrina/      la Vitrina de Modistas (servicio vitrina, D-15)
#
# Lo usa Dokploy (proyecto "Portafolio", servicio costura-app) con
# "Compose Path" = ./docker/compose.vps.yml.
#
# - La app se compila para la subruta /costura-app/ (BASE_PATH).
# - El contenedor solo escucha dentro del servidor (127.0.0.1:3014). El nginx del
#   VPS, que atiende proyectosena.online con HTTPS, reenvía /costura-app/ a ese
#   puerto quitando el prefijo (docker/nginx-vps.conf).
services:
  web:
    build:
      context: ..
      args:
        BASE_PATH: /costura-app/
        # Enlace público del APK para el botón "Descargar App (Android)"
        VITE_APK_DOWNLOAD_URL: ${VITE_APK_DOWNLOAD_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3014:8080"

  # Vitrina de Modistas: lo único con datos en el servidor. Solo guarda lo que
  # las modistas publican (perfil del taller y prendas con foto), nunca clientas.
  # VITRINA_CLAVE_ADMIN se define en las variables de entorno de Dokploy, no aquí.
  vitrina:
    build:
      context: ../vitrina
    restart: unless-stopped
    environment:
      VITRINA_CLAVE_ADMIN: ${VITRINA_CLAVE_ADMIN:-}
      VITRINA_CONFIAR_PROXY: "1"
    volumes:
      - vitrina-datos:/datos
    ports:
      - "127.0.0.1:3015:8080"

volumes:
  vitrina-datos:
