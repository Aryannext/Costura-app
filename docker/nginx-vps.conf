# Costura App dentro del sitio del portafolio: https://proyectosena.online/costura-app/
#
# Se incluye en el bloque server 443 de proyectosena.online, igual que taller.conf y
# sincronizacion.conf:
#     include /home/cristian/proyectos/proyectosena.online/costura-app/despliegue/nginx/costura-app.conf;
#
# El contenedor lo levanta Dokploy con docker/compose.vps.yml y solo escucha en
# 127.0.0.1:3014. Dentro del contenedor la app vive en la raíz; la barra final de
# proxy_pass quita el prefijo /costura-app/ antes de reenviar.
#
# ^~ es obligatorio. El portafolio tiene una location con expresión regular que entrega
# a cualquier ruta terminada en sql-wasm.wasm el archivo de la versión vieja de agosto
# (/costura). Sin ^~, la app nueva cargaría ese wasm en lugar del suyo. Además
# /costura-app/ es un prefijo más largo que /costura, así que gana a la location vieja.

location = /costura-app {
    return 301 /costura-app/;
}

location ^~ /costura-app/ {
    proxy_pass http://127.0.0.1:3014/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Se reemplaza, no se agrega: nadie puede falsear su IP en los registros
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
