# nginx para la versión web (single page application de Vue)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ojo: un bloque "types {}" aquí reemplazaría TODA la tabla de tipos de nginx
    # (los .css y .js saldrían con tipo incorrecto). Por eso los tipos que pueden
    # faltar se fijan con default_type solo para su extensión.
    location ~* \.wasm$ {
        default_type application/wasm;   # sql.js: SQLite en el navegador
        try_files $uri =404;
        include /etc/nginx/conf.d/seguridad.inc;
    }
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        include /etc/nginx/conf.d/seguridad.inc;
    }

    # Comprobación de vida para Docker y para el panel del VPS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: se pueden guardar en caché un año.
    # Si uno no existe se responde 404, nunca index.html disfrazado de JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/seguridad.inc;
    }

    # index.html no se guarda en caché, para que una versión nueva llegue de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/seguridad.inc;
    }

    # Cualquier otra ruta (/ordenes/3, /clientes...) la resuelve Vue Router
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/seguridad.inc;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
